name: Manoj Narang Strategy Automated Execution

on:
  schedule:
    - cron: '50 19 * * 5' # Friday at 19:50 UTC (3:50 PM ET)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-quant-strategy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Strategy Script
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        LONG_THRESHOLD: "-0.05"
        SHORT_THRESHOLD: "0.10"
        LONG_BASE_USD: "5.0"
        SHORT_BASE_USD: "10.0"
        DYNAMIC_SIZING: "True"
      run: |
        python strategy.py

    - name: Commit Performance Tracking State
      run: |
        git config --global user.name "Quant Bot"
        git config --global user.email "bot@github.com"
        git add trade_history.json || true
        git commit -m "Update strategy performance metrics [skip ci]" || true
        git push origin main || true
